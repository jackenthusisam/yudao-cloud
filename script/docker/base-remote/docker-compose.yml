name: yudao-cloud-base

services:
  mysql:
    image: mysql:8.0.33
    container_name: yudao-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ruoyi-vue-pro}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../../sql/mysql/ruoyi-vue-pro.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --explicit_defaults_for_timestamp=true
      - --lower_case_table_names=1
      - --performance_schema=OFF
      - --innodb-buffer-pool-size=128M
      - --max-connections=100
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -uroot -p$${MYSQL_ROOT_PASSWORD} --silent" ]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.2
    container_name: yudao-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-26379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 12

  nacos:
    image: nacos/nacos-server:v2.4.2
    container_name: yudao-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_IDENTITY_KEY: yudao
      NACOS_AUTH_IDENTITY_VALUE: yudao
      NACOS_AUTH_TOKEN: eXVkYW8tY2xvdWQtZGV2LW5hY29zLXNlY3JldC1rZXktMzItYnl0ZXMtY2hhbmdlLW1l
      NACOS_AUTH_TOKEN_EXPIRE_SECONDS: 18000
      NACOS_AUTH_CACHE_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/actuator/health | grep -q UP" ]
      interval: 10s
      timeout: 5s
      retries: 30

  gateway:
    image: yudao-gateway:base
    container_name: yudao-gateway
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_CLOUD_NACOS_SERVER_ADDR: 127.0.0.1:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: 127.0.0.1:8848
      SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: ${NACOS_NAMESPACE:-}
      SPRING_CLOUD_NACOS_CONFIG_NAMESPACE: ${NACOS_NAMESPACE:-}
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ${SERVER_IP:-8.141.17.93}
      JAVA_OPTS: -Xms128m -Xmx256m -XX:MaxMetaspaceSize=160m
    volumes:
      - /docker/yudao-cloud/logs:/root/logs
    depends_on:
      nacos:
        condition: service_healthy

  system:
    image: yudao-module-system-server:base
    container_name: yudao-system
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_CLOUD_NACOS_SERVER_ADDR: 127.0.0.1:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: 127.0.0.1:8848
      SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: ${NACOS_NAMESPACE:-}
      SPRING_CLOUD_NACOS_CONFIG_NAMESPACE: ${NACOS_NAMESPACE:-}
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ${SERVER_IP:-8.141.17.93}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:mysql://127.0.0.1:${MYSQL_HOST_PORT:-13306}/${MYSQL_DATABASE:-ruoyi-vue-pro}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: root
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_URL: jdbc:mysql://127.0.0.1:${MYSQL_HOST_PORT:-13306}/${MYSQL_DATABASE:-ruoyi-vue-pro}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_USERNAME: root
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      SPRING_DATA_REDIS_HOST: 127.0.0.1
      SPRING_DATA_REDIS_PORT: ${REDIS_HOST_PORT:-26379}
      SPRING_DATA_REDIS_DATABASE: 0
      XXL_JOB_ENABLED: "false"
      JAVA_OPTS: -Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m
    volumes:
      - /docker/yudao-cloud/logs:/root/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy

  infra:
    image: yudao-module-infra-server:base
    container_name: yudao-infra
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_CLOUD_NACOS_SERVER_ADDR: 127.0.0.1:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: 127.0.0.1:8848
      SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: ${NACOS_NAMESPACE:-}
      SPRING_CLOUD_NACOS_CONFIG_NAMESPACE: ${NACOS_NAMESPACE:-}
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ${SERVER_IP:-8.141.17.93}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:mysql://127.0.0.1:${MYSQL_HOST_PORT:-13306}/${MYSQL_DATABASE:-ruoyi-vue-pro}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: root
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_URL: jdbc:mysql://127.0.0.1:${MYSQL_HOST_PORT:-13306}/${MYSQL_DATABASE:-ruoyi-vue-pro}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_USERNAME: root
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      SPRING_DATA_REDIS_HOST: 127.0.0.1
      SPRING_DATA_REDIS_PORT: ${REDIS_HOST_PORT:-26379}
      SPRING_DATA_REDIS_DATABASE: 0
      XXL_JOB_ENABLED: "false"
      JAVA_OPTS: -Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m
    volumes:
      - /docker/yudao-cloud/logs:/root/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
